[package]
name = "caelum-liber-arcanorum"
version = "0.1.0"
description = "Liber Arcanorum — tarot reading app of the Caelum series"
authors = ["osprey74"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin name (Windows, cargo#8519).
name = "caelum_liber_arcanorum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
