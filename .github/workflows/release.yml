name: Release

# Windows installer (NSIS .exe).
# - Tag push (v1.2.3): builds and attaches the installer to a DRAFT release (publish it by hand).
# - Run workflow (manual): builds and keeps the installer as a workflow artifact only (no release).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # Only the card images the app bundles come from Git LFS (about 44 MB). The card art sources under
      # tools/ are not needed for the build and would use far more of the LFS bandwidth quota.
      - name: Fetch card images (Git LFS)
        run: git lfs pull --include="src/assets/cards/**"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        run: npm test

      # ── Tag push: draft release ──
      - name: Build and attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Liber Arcanorum ${{ github.ref_name }}'
          releaseBody: |
            Windows 向けのインストーラーです。

            インストーラーには電子署名がないため、初回の起動時に Windows の SmartScreen の警告が表示されることがあります。その場合は「詳細情報」から「実行」を選んでください。

            ---

            Installer for Windows. The installer is not code-signed, so Windows SmartScreen may show a warning on first run; choose "More info" and then "Run anyway".
          releaseDraft: true
          prerelease: false

      # ── Manual run: workflow artifact only ──
      - name: Build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri build

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: liber-arcanorum-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
